<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content & Settings - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #07101f; color: #f1f6fc; font-family: Arial, sans-serif; }
        .admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; min-height: 100vh; padding: 20px; }
        .admin-sidebar { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 15px; height: max-content; }
        .admin-sidebar h3 { color: #00d9ff; margin-bottom: 15px; font-size: 18px; }
        .admin-menu { width: 100%; text-align: left; padding: 10px; margin: 4px 0; border: 0; border-radius: 5px; background: transparent; color: #fff; font-weight: bold; display: block; text-decoration: none; }
        .admin-menu:hover, .admin-menu.active { background: #0878e8; color: #fff; }
        .logout-btn { color: #ff6b6b !important; }
        .section-title { color: #63eaff; font-weight: 800; margin-bottom: 20px; }
        .esports-card { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 20px; }
        .esports-input { background: #071323 !important; color: #fff !important; border-color: #35516d !important; }
        .esports-btn { background: linear-gradient(90deg,#00bfff,#006cff); border: 0; color: #fff; font-weight: bold; }
        @media(max-width:992px){ .admin-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <h3>⚙ ADMIN PANEL</h3>
        <a href="dashboard.html" class="admin-menu">📊 Dashboard</a>
        <a href="tournaments.html" class="admin-menu">🏆 Tournaments</a>
        <a href="players.html" class="admin-menu">👤 Players</a>
        <a href="results.html" class="admin-menu">📋 Results</a>
        <a href="content.html" class="admin-menu active">⚙ Content</a>
        <a href="login.html" class="admin-menu logout-btn">🚪 Logout</a>
    </aside>
    <div class="admin-content">
        <h2 class="section-title">⚙ CONTENT & SETTINGS</h2>
        <div class="card esports-card">
            <h3>Manage Rules</h3>
            <form onsubmit="saveSettings(event)" class="mt-3">
                <div class="mb-3"><label>Rule 1</label><input id="r1" class="form-control esports-input" value="No team-up during Solo matches." required></div>
                <div class="mb-3"><label>Rule 2</label><input id="r2" class="form-control esports-input" value="No refunds after registration." required></div>
                <div class="mb-3"><label>Rule 3</label><input id="r3" class="form-control esports-input" value="Cheating and hacks are prohibited." required></div>
                <button class="btn btn-primary esports-btn" type="submit">SAVE SETTINGS</button>
            </form>
        </div>
    </div>
</div>
<script>
    function saveSettings(event) {
        event.preventDefault();
        const rule1 = document.getElementById("r1").value.trim();
        if (rule1 === "") {
            alert("Rule cannot be empty!");
            return;
        }
        alert("Settings saved!");
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
