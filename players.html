<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registrations - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #07101f; color: #f1f6fc; font-family: Arial, sans-serif; }
        .admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; min-height: 100vh; padding: 20px; }
        .admin-sidebar { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 15px; height: max-content; }
        .admin-sidebar h3 { color: #00d9ff; margin-bottom: 15px; font-size: 18px; }
        .admin-menu { width: 100%; text-align: left; padding: 10px; margin: 4px 0; border: 0; border-radius: 5px; background: transparent; color: #fff; font-weight: bold; display: block; text-decoration: none; }
        .admin-menu:hover, .admin-menu.active { background: #0878e8; color: #fff; }
        .logout-btn { color: #ff6b6b !important; }
        .section-title { color: #63eaff; font-weight: 800; margin-bottom: 20px; }
        .esports-card { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 20px; }
        .esports-table th { background: #17385d; color: #6cecff; border-color: #38536e; padding: 13px; }
        .esports-table td { background: #101d31; color: #f2f8ff; border-color: #304862; padding: 13px; }
        .status-badge { background: #084a36; color: #63ffbd; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        @media(max-width:992px){ .admin-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <h3>⚙ ADMIN PANEL</h3>
        <a href="dashboard.html" class="admin-menu">📊 Dashboard</a>
        <a href="tournaments.html" class="admin-menu">🏆 Tournaments</a>
        <a href="players.html" class="admin-menu active">👤 Players</a>
        <a href="results.html" class="admin-menu">📋 Results</a>
        <a href="content.html" class="admin-menu">⚙ Content</a>
        <a href="login.html" class="admin-menu logout-btn">🚪 Logout</a>
    </aside>
    <div class="admin-content">
        <h2 class="section-title">👤 PLAYER REGISTRATIONS</h2>
        <div class="card esports-card">
            <div class="table-responsive">
                <table class="table esports-table align-middle">
                    <thead><tr><th>PLAYER</th><th>ID</th><th>MODE</th><th>PAYMENT</th><th>ACTION</th></tr></thead>
                    <tbody>
                        <tr><td>Player 1</td><td>ID100</td><td>Solo</td><td><span class="status-badge">PAID</span></td><td><button class="btn btn-sm btn-primary" onclick="alert('Viewing Player 1')">View</button></td></tr>
                        <tr><td>Player 2</td><td>ID101</td><td>Duo</td><td><span class="status-badge">PAID</span></td><td><button class="btn btn-sm btn-primary" onclick="alert('Viewing Player 2')">View</button></td></tr>
                        <tr><td>Player 3</td><td>ID102</td><td>Squad</td><td>Pending</td><td><button class="btn btn-sm btn-primary" onclick="alert('Viewing Player 3')">View</button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
