<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Esports - Contact & Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #07101f; color: #f1f6fc; font-family: Arial, sans-serif; }
        .esports-nav { background: #0b1629; border-bottom: 2px solid #00d9ff; }
        .logo-btn { background: none; border: 0; color: #00d9ff; font-size: 22px; font-weight: bold; text-decoration: none; }
        .nav-link { color: #fff !important; font-size: 13px; font-weight: bold; }
        .nav-link:hover { color: #00d9ff !important; }
        .section-title { color: #63eaff; font-weight: 800; margin-bottom: 20px; }
        .contact-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .esports-card, .info-card { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 25px; color: #f1f6fc; }
        .esports-input { background: #071323 !important; color: #fff !important; border-color: #35516d !important; }
        .esports-input:focus { border-color: #00d9ff !important; box-shadow: 0 0 0 .15rem #00d9ff22 !important; }
        .esports-btn { background: linear-gradient(90deg,#00bfff,#006cff); border: 0; color: #fff; font-weight: bold; }
        footer { background: #0b1629; border-top: 1px solid #304963; text-align: center; padding: 20px; color: #d3dfec; margin-top: 40px; }
        @media(max-width:768px){ .contact-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark esports-nav sticky-top">
    <div class="container">
        <a class="logo-btn" href="index.html">⚡ RAI ESPORTS</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" href="index.html">HOME</a>
            <a class="nav-link" href="tournament.html">TOURNAMENT</a>
            <a class="nav-link" href="leaderboard.html">LEADERBOARD</a>
            <a class="nav-link" href="rules.html">RULES</a>
            <a class="nav-link active" href="contact.html">CONTACT</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <h2 class="section-title">📞 CONTACT & SUPPORT</h2>
    <div class="contact-grid">
        <div class="card esports-card">
            <h3>Send Message</h3>
            <form onsubmit="sendMessage(event)">
                <div class="mb-3"><label>Name</label><input class="form-control esports-input" required placeholder="Enter your name"></div>
                <div class="mb-3"><label>Email / Mobile</label><input class="form-control esports-input" required placeholder="Enter contact"></div>
                <div class="mb-3"><label>Password (Security Check)</label><input type="password" id="password" class="form-control esports-input" required placeholder="Enter password"></div>
                <div class="mb-3"><label>Message</label><textarea class="form-control esports-input" rows="4" required placeholder="Write your message"></textarea></div>
                <button class="btn btn-primary esports-btn" type="submit">SEND MESSAGE</button>
            </form>
        </div>
        <div>
            <div class="info-card mb-4"><h3>💬 Support</h3><p>Rai Esports Admin</p><p>Daily support available.</p></div>
            <div class="info-card"><h3>🌐 Community</h3><p>Instagram / Telegram</p></div>
        </div>
    </div>
</main>
<footer>
    <div class="container"><p>⚡ Rai Esports | 🔥 Free Fire Tournament Platform</p></div>
</footer>
<script>
    function sendMessage(event) {
        event.preventDefault();
        const pwd = document.getElementById("password").value;
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
        
        if (!regex.test(pwd)) {
            alert("Password must include uppercase, lowercase, number and special character!");
            return;
        }
        alert("Message submitted successfully!");
        event.target.reset();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
