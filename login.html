<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Rai Esports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #07101f; color: #f1f6fc; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; background: #101d31; border: 1px solid #304963; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px #00d9ff22; }
        .esports-input { background: #071323 !important; color: #fff !important; border-color: #35516d !important; }
        .esports-btn { background: linear-gradient(90deg,#00bfff,#006cff); border: 0; color: #fff; font-weight: bold; }
        .section-title { color: #63eaff; font-weight: 800; }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="section-title mb-4">🔐 ADMIN LOGIN</h2>
    <form onsubmit="adminLogin(event)">
        <div class="mb-3"><label>Username</label><input id="username" class="form-control esports-input" required placeholder="admin"></div>
        <div class="mb-3"><label>Password</label><input id="password" type="password" class="form-control esports-input" required placeholder="admin"></div>
        <button class="btn btn-primary esports-btn w-100" type="submit">LOGIN</button>
    </form>
    <p class="text-muted mt-3 small">Demo login: admin / admin</p>
    <div class="mt-2"><a href="../CLIENT/index.html" class="text-info text-decoration-none small">← Back to Website</a></div>
</div>
<script>
    function adminLogin(event) {
        event.preventDefault();
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if (u === "admin" && p === "admin") {
            window.location.href = "dashboard.html";
        } else {
            alert("Incorrect Username or Password!");
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
