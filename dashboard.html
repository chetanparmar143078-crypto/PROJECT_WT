<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rai Esports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #07101f; color: #f1f6fc; font-family: Arial, sans-serif; }
        .admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; min-height: 100vh; padding: 20px; }
        .admin-sidebar { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 15px; height: max-content; }
        .admin-sidebar h3 { color: #00d9ff; margin-bottom: 15px; font-size: 18px; }
        .admin-menu { width: 100%; text-align: left; padding: 10px; margin: 4px 0; border: 0; border-radius: 5px; background: transparent; color: #fff; font-weight: bold; display: block; text-decoration: none; }
        .admin-menu:hover, .admin-menu.active { background: #0878e8; color: #fff; }
        .logout-btn { color: #ff6b6b !important; }
        .admin-stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }
        .stat-card { background: #101d31; border: 1px solid #304963; padding: 18px; border-left: 4px solid #00d9ff; border-radius: 8px; }
        .stat-card p { color: #b7c6d6; margin-bottom: 5px; }
        .stat-card h2 { color: #00d9ff; font-size: 32px; }
        .section-title { color: #63eaff; font-weight: 800; margin-bottom: 20px; }
        .info-card { background: #101d31; border: 1px solid #304963; border-radius: 10px; padding: 20px; }
        @media(max-width:992px){ .admin-layout { grid-template-columns: 1fr; } .admin-stat-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <h3>⚙ ADMIN PANEL</h3>
        <a href="dashboard.html" class="admin-menu active">📊 Dashboard</a>
        <a href="tournaments.html" class="admin-menu">🏆 Tournaments</a>
        <a href="players.html" class="admin-menu">👤 Players</a>
        <a href="results.html" class="admin-menu">📋 Results</a>
        <a href="content.html" class="admin-menu">⚙ Content</a>
        <a href="login.html" class="admin-menu logout-btn">🚪 Logout</a>
    </aside>
    <div class="admin-content">
        <h2 class="section-title">📊 DASHBOARD</h2>
        <div class="admin-stat-grid">
            <div class="stat-card"><p>Total Players</p><h2>120</h2></div>
            <div class="stat-card"><p>Today's Matches</p><h2>6</h2></div>
            <div class="stat-card"><p>Pending Results</p><h2>2</h2></div>
        </div>
        <div class="info-card mt-4">
            <h3>Recent Activity</h3>
            <p class="mb-1">• Player 1 registered successfully</p>
            <p class="mb-1">• Player 2 registered successfully</p>
            <p class="mb-0">• Player 3 registered successfully</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
